# nginx do container. O HTTPS fica no proxy da Coolify; o endereço principal é com www.

# Cache por tipo de arquivo:
# - /_astro/ tem hash no nome (muda a cada build): cache de 1 ano
# - imagens e ícones de public/: 7 dias
# - HTML, robots.txt e sitemap.xml: sempre revalidam, para o deploy novo aparecer na hora
map $uri $cache_control {
  ~^/_astro/                                  "public, max-age=31536000, immutable";
  ~*\.(?:jpe?g|png|webp|avif|svg|ico|woff2)$  "public, max-age=604800";
  default                                     "no-cache";
}

# Domínio sem www: redireciona para o www mantendo caminho e query string
server {
  listen 80;
  server_name davimanoel.com.br;
  server_tokens off;
  return 301 https://www.davimanoel.com.br$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # atrás do proxy: redirecionamentos relativos, sem "http://" nem porta interna
  absolute_redirect off;
  charset utf-8;
  charset_types text/css text/plain text/xml application/xml application/javascript image/svg+xml;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/xml application/xml application/javascript application/json image/svg+xml;

  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
